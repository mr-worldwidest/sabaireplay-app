<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sabai Replay helps you review every round and improve your game."
    />
    <title>Sabai Replay — Improve every round.</title>
    <link rel="icon" href="sabai-icon.jpg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --ink: #050505;
        --paper: #ffffff;
        --muted: #9a9a9a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background: var(--ink);
        color: var(--paper);
        font-family:
          "SF Pro Text",
          "SF Pro Display",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          "Segoe UI",
          Helvetica,
          Arial,
          sans-serif;
        text-align: center;
      }

      main {
        min-height: 100vh;
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px 24px;
        gap: 36px;
      }

      .icon {
        width: 120px;
        height: 120px;
        border-radius: 26px;
        display: block;
        margin: 0 auto;
        object-fit: cover;
      }

      h1 {
        margin: 0 auto;
        max-width: 100%;
        font-family: Kanit, sans-serif;
        font-weight: 400;
        font-size: clamp(1.15rem, 2.6vw, 1.35rem);
        line-height: 1.45;
        letter-spacing: 0.01em;
        text-align: center;
      }

      .waitlist {
        width: min(100%, 360px);
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        margin: 0 auto;
      }

      .waitlist label[for="email"] {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .waitlist input[type="email"] {
        width: 100%;
        height: 48px;
        margin: 0;
        padding: 0 14px;
        border: 1px solid #2c2c2c;
        border-radius: 8px;
        background: transparent;
        color: var(--paper);
        font: inherit;
        font-size: 1rem;
        text-align: center;
      }

      .waitlist input[type="email"]::placeholder {
        color: var(--muted);
      }

      .waitlist input[type="email"]:focus-visible {
        outline: 2px solid var(--paper);
        outline-offset: 2px;
      }

      .waitlist button {
        height: 48px;
        border: 0;
        border-radius: 8px;
        background: #fff;
        color: #000;
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }

      .waitlist button:hover {
        opacity: 0.88;
      }

      .waitlist button:focus-visible {
        outline: 2px solid var(--paper);
        outline-offset: 2px;
      }

      .waitlist button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .consent-note,
      .consent {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.45;
        text-align: left;
      }

      .consent-note a {
        color: inherit;
      }

      .consent {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        cursor: pointer;
      }

      .consent input {
        width: 16px;
        height: 16px;
        margin: 2px 0 0;
        flex: none;
        accent-color: #fff;
      }

      .consent input:focus-visible {
        outline: 2px solid var(--paper);
        outline-offset: 2px;
      }

      .waitlist-status {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .honey {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .legal {
        margin: 8px auto 0;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.5;
        text-align: center;
      }

      .legal a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .legal a:hover {
        color: var(--paper);
      }

      @media (max-width: 480px) {
        main {
          gap: 28px;
          padding: 40px 20px;
        }
        .icon {
          width: 100px;
          height: 100px;
          border-radius: 22px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="icon" src="sabai-icon.jpg" alt="Sabai Replay app icon" />
      <h1>Improve every round.<br />Replay the moments that matter.</h1>
      <form class="waitlist" id="waitlist" novalidate>
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          spellcheck="false"
          required
          placeholder="Email address"
        />
        <input
          class="honey"
          type="text"
          name="_honey"
          tabindex="-1"
          autocomplete="off"
          aria-hidden="true"
        />
        <p class="consent-note">
          Y1 Engineering, LLC will email you when Sabai Replay is available.
          You confirm you are 13 or older.
          <a href="privacy.html">Privacy Policy</a>
        </p>
        <label class="consent" for="marketing">
          <input id="marketing" name="marketing" type="checkbox" value="yes" />
          <span>Also email me occasional updates and offers. Unsubscribe any time.</span>
        </label>
        <button type="submit">Join the waitlist</button>
        <p class="waitlist-status" role="status" hidden></p>
      </form>
      <p class="legal">
        View our <a href="privacy.html">Privacy Policy</a> |
        <a href="terms.html">Terms of Use</a> |
        <a href="support.html">Support</a>
      </p>
    </main>
    <script>
      const form = document.getElementById("waitlist");
      const status = form.querySelector(".waitlist-status");
      const emailInput = form.querySelector("#email");
      const marketingInput = form.querySelector("#marketing");
      const button = form.querySelector("button");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = emailInput.value.trim();
        emailInput.value = email;
        status.hidden = false;

        if (form.querySelector("[name='_honey']").value) {
          form.replaceChildren(status);
          status.textContent = "You're on the list.";
          return;
        }

        if (!emailInput.checkValidity()) {
          status.textContent = "Enter an email address.";
          emailInput.focus();
          return;
        }

        const marketing = marketingInput.checked;
        button.disabled = true;
        const label = button.textContent;
        button.textContent = "Joining…";
        status.textContent = "";

        try {
          const response = await fetch(
            "https://formsubmit.co/ajax/y1engineeringllc@gmail.com",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify({
                email,
                marketing: marketing ? "yes" : "no",
                consent: "Email me when Sabai Replay is available. I am 13 or older.",
                marketing_consent: marketing
                  ? "Also email me occasional updates and offers. Unsubscribe any time."
                  : "no",
                source: "https://sabaireplay.app",
                consented_at: new Date().toISOString(),
                _subject: marketing
                  ? "Sabai Replay waitlist + updates"
                  : "Sabai Replay waitlist",
                _captcha: "false",
                _template: "box",
              }),
            }
          );
          const data = await response.json().catch(() => ({}));
          const message = String(data.message || "");
          const accepted =
            data.success === true ||
            data.success === "true" ||
            /needs activation/i.test(message);
          if (!response.ok || !accepted) {
            status.textContent = "Couldn't add that email. Try again.";
            button.disabled = false;
            button.textContent = label;
            return;
          }
          form.replaceChildren(status);
          status.textContent = marketing
            ? "You're on the list. We'll email you when Sabai Replay is available, and send occasional updates. Unsubscribe any time."
            : "You're on the list. We'll email you when Sabai Replay is available.";
        } catch {
          status.textContent = "Couldn't add that email. Try again.";
          button.disabled = false;
          button.textContent = label;
        }
      });
    </script>
  </body>
</html>
