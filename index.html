<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sabai Replay helps you review every round and improve your game.">
  <title>Sabai Replay — Improve every round.</title>
  <link rel="icon" href="sabai-icon.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #050505;
      --paper: #ffffff;
      --muted: #9a9a9a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--ink);
      color: var(--paper);
      font-family: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
      text-align: center;
    }

    main {
      min-height: 100vh;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
      gap: 36px;
    }

    .icon {
      width: 120px;
      height: 120px;
      border-radius: 26px;
      display: block;
      margin: 0 auto;
      object-fit: cover;
    }

    h1 {
      margin: 0 auto;
      max-width: 100%;
      font-family: Kanit, sans-serif;
      font-weight: 400;
      font-size: clamp(1.15rem, 2.6vw, 1.35rem);
      line-height: 1.45;
      letter-spacing: 0.01em;
      text-align: center;
    }

    .store-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #fff;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      padding: 8px 16px 8px 12px;
      min-width: 168px;
      margin: 0 auto;
      transition: opacity 0.2s ease;
    }

    .store-button:hover {
      opacity: 0.88;
    }

    .apple {
      font: 1.85rem/1 "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      margin-top: -2px;
    }

    .store-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.05;
      text-align: left;
    }

    .store-copy small {
      font-size: 0.62rem;
      letter-spacing: 0.01em;
    }

    .store-copy strong {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .legal {
      margin: 8px auto 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
      text-align: center;
    }

    .legal a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .legal a:hover {
      color: var(--paper);
    }

    @media (max-width: 480px) {
      main { gap: 28px; padding: 40px 20px; }
      .icon { width: 100px; height: 100px; border-radius: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="sabai-icon.jpg" alt="Sabai Replay app icon">
    <h1>Improve every round.<br>Replay the moments that matter.</h1>
    <a class="store-button" href="#" aria-label="Download Sabai Replay on the App Store">
      <span class="apple" aria-hidden="true">&#63743;</span>
      <span class="store-copy">
        <small>Download on the</small>
        <strong>App Store</strong>
      </span>
    </a>
    <p class="legal">
      View our <a href="privacy.html">Privacy Policy</a> | <a href="support.html">Support</a>
    </p>
  </main>
</body>
</html>
